name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Text guard with negative self-test
        run: |
          npm run check:text
          npm run check:text:negative
      - name: Build
        run: npm run build
      - name: Config core unit tests
        run: npm run test:unit
      - name: Smoke test
        timeout-minutes: 5
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1 -Seconds 6
      - name: Full behaviour matrix
        timeout-minutes: 10
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-behaviour.ps1
