name: Release

# Builds and publishes the portable launcher and the NSIS installer.
#
# Signing is optional: the workflow signs automatically when the matching
# repository secrets exist, and falls back to an unsigned build when they do
# not. See docs/CODE_SIGNING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------- signing
      # Azure Trusted Signing (preferred: no certificate file to store or rotate).
      # Only runs when all four secrets are configured.
      - name: Sign in to Azure
        if: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and package
        env:
          # Azure Trusted Signing -- ignored when unset (electron-builder.config.cjs
          # only adds azureSignOptions once all three values are present).
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Certificate-file signing -- the alternative backend. Set
          # WIN_CSC_LINK to the base64 of a .pfx and WIN_CSC_KEY_PASSWORD to its
          # password; leave both empty to skip certificate signing.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run pack:all

      - name: Report signature status
        shell: pwsh
        run: |
          Get-ChildItem dist/portable, dist/installer -File -Filter *.exe |
            ForEach-Object {
              "{0,-46} {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status
            }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/portable/CalicoPet-portable-*.exe
            dist/installer/CalicoPet-setup-*.exe
            dist/installer/*.blockmap
          generate_release_notes: true

      # Users who download an unsigned build get a SmartScreen warning; publishing
      # checksums lets them at least confirm the file arrived intact.
      - name: Write checksums
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem dist/portable, dist/installer -File -Filter *.exe |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload checksums
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS.txt
