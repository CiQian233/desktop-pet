name: Release

# Builds and publishes the portable launcher and the NSIS installer.
#
# Triggered by a v* tag. Can also be run manually (workflow_dispatch), in which
# case it only verifies that the build succeeds and does NOT publish anything.
#
# Signing is optional: the workflow signs automatically when the matching
# repository secrets exist, and falls back to an unsigned build when they do
# not. See docs/CODE_SIGNING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    # Secrets are read into env here rather than inline, because the `secrets`
    # context is NOT available inside `steps[*].if` -- referencing it there makes
    # GitHub reject the whole workflow file ("workflow file issue", zero jobs).
    # `env` is available in `if`, so the conditions below test env instead.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
      # Empty when the secret is absent, which electron-builder treats as
      # "no signing material" and skips signing instead of failing.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------- signing
      # Azure Trusted Signing needs an Entra ID login. Only runs when the secret
      # is configured; otherwise the build stays unsigned.
      - name: Sign in to Azure
        if: env.AZURE_CLIENT_SECRET != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and package
        run: npm run pack:all

      # Reporting only -- Get-AuthenticodeSignature does not autoload in every host,
      # so a failure here must not fail a build whose artifacts are already produced.
      - name: Report signature status
        shell: pwsh
        continue-on-error: true
        run: |
          if (Get-Command Get-AuthenticodeSignature -ErrorAction SilentlyContinue) {
            Get-ChildItem dist/portable, dist/installer -File -Filter *.exe |
              ForEach-Object {
                "{0,-46} {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status
              }
          } else {
            Write-Host '(Get-AuthenticodeSignature unavailable -- skipped)'
          }

      # Lets users confirm a download arrived intact -- worth having precisely
      # because the artifacts are unsigned and trigger a SmartScreen warning.
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/portable, dist/installer -File -Filter *.exe |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        # Tag pushes publish; a manual run only proves the build works, so it must
        # not create a release from refs/heads/main.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/portable/CalicoPet-portable-*.exe
            dist/installer/CalicoPet-setup-*.exe
            dist/installer/*.blockmap
            dist/SHA256SUMS.txt
          generate_release_notes: true
